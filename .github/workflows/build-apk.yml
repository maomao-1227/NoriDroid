# 云构建：自定义模型导入版（2026-11-03）
#
# 与原仓库的 android.yml 区别：
#   1. 产出 APK 并上传为 artifact（原版只验证、不上传）
#   2. 跳过"82 项打包预检"和门禁测试（它们针对官方 UI，本分支改了设置页）
#   3. 签名：仓库里若有 keystore.properties 就用它；否则回退 debug 签名
#      → debug 签名每次构建都不同，**装新版本前需先卸载**（聊天/记忆/日记在公共目录，不丢）
#
# 触发方式：Actions → 本 workflow → Run workflow

name: 构建自定义模型版 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/android/web-src/pnpm-lock.yaml

      - name: 装前端依赖
        working-directory: app/android/web-src
        run: |
          # 上游 postinstall 会给 live2d-easy-control 打补丁；其中 2 个补丁
          # （__noriHasParam / __noriSetParam）的锚点随库版本漂移，失败会 exit 1 掐死构建。
          # 这里先装依赖不跑脚本，再单独执行补丁；允许部分补丁失败——
          # 缺失只影响两个参数钩子，不影响模型加载、渲染与本次要加的功能。
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/patch-live2d.mjs || echo "::warning::patch-live2d 有补丁未应用（上游锚点漂移），继续构建"

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then echo "sdkmanager not found" >&2; exit 1; fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: 补丁：提高遮罩精度（Cubism 5 模型脸部遮罩错乱）
        working-directory: app/android/web-src
        run: |
          F=node_modules/live2d-easy-control/live2dEasyControl.js
          if [ -f "$F" ]; then
            sed -i 's/_clippingMaskBufferSize = 256/_clippingMaskBufferSize = 2048/' "$F"
            sed -i 's/_useHighPrecisionMask = !1/_useHighPrecisionMask = !0/' "$F"
            echo "遮罩缓冲:"; grep -o "_clippingMaskBufferSize = [0-9]*" "$F" | head -1
            echo "高精度遮罩:"; grep -o "_useHighPrecisionMask = !0" "$F" | head -1
          else
            echo "::warning::找不到 live2dEasyControl.js，跳过"
          fi

      - name: 构建前端（vue-tsc + vite）
        working-directory: app/android/web-src
        run: pnpm build

      - name: 构建 APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: 收集产物
        working-directory: app/android/app/build/outputs/apk/release
        run: |
          APK=$(ls *.apk | head -1)
          cp "$APK" "$GITHUB_WORKSPACE/NoriDroid-custom-model.apk"
          sha256sum "$GITHUB_WORKSPACE/NoriDroid-custom-model.apk"
          ls -lh "$GITHUB_WORKSPACE/NoriDroid-custom-model.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: NoriDroid-custom-model-apk
          path: ${{ github.workspace }}/NoriDroid-custom-model.apk
          retention-days: 30
